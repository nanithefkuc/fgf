name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  # The dispatch layer picks one backend per process, so a single test run only
  # ever exercises the host's best. Re-run the suite pinned to each weaker
  # backend the host can still execute.
  backends:
    name: backend sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: v3
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: v2
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: scalar

  # Ground rule: line coverage of the crate's own source must stay at or
  # above 95%. One run per forced backend tier, merged, so every
  # dispatchable backend counts; the default run also exercises the AVX-512
  # kernels in kernel/x86/avx512.rs, which only execute on this runner's
  # AVX-512 host (they are the deferred tier and never dispatch).
  coverage:
    name: coverage >=95% (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - run: cargo llvm-cov --no-report --all-features
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v3
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v2
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: scalar
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --fail-under-lines 95 --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage.lcov

  cross:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }}

  msrv:
    name: msrv 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo build --all-features

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    name: miri (scalar paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Miri cannot execute the SIMD intrinsics; pin to the portable backend so
      # it validates the slice and pointer arithmetic in the wrappers instead.
      - run: cargo miri test --no-default-features
        env:
          # Optimize the interpreted MIR; the arithmetic-heavy scalar suites
          # dominate the job otherwise.
          MIRIFLAGS: -Zmir-opt-level=3
