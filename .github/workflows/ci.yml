name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      # `alloc` sits between the two ends above: the prepared coefficient
      # collections without `std`. Neither end builds it.
      - run: cargo test --no-default-features --features alloc

  # Hosted runners must prove the AVX2 floor they execute. Stronger requests
  # are reported as requests, not credited as executed ISA coverage.
  isa-accept:
    name: isa-accept v3 (backend floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - name: requested vs resolved backend per tier
        run: |
          for tier in v4x v3_gfni_crypto v3 v2 scalar; do
            echo "── SIMD_BACKEND=${tier}"
            SIMD_BACKEND="${tier}" just backend-report
          done
      - name: fail closed, then tier differentials
        run: just isa-accept v3

  # Coverage merges tiers and portable features. Its documented exclusions
  # include binary kernels/dispatch; native differentials run on acceptance hosts.
  coverage:
    name: coverage >=95% (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.148
      - uses: extractions/setup-just@v2
      - run: just cover
      - run: just cover-lcov
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage.lcov

  cross:
    name: cross-check aarch64 + wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,wasm32-unknown-unknown
      - uses: extractions/setup-just@v2
      # The recipe checks the non-x86 library paths with --all-features,
      # including Wasm's explicit `simd128` compile lane.
      - run: just cross-check
      # Default-feature link builds per target, mirroring the release matrix.
      - run: cargo build --target aarch64-unknown-linux-gnu
      - run: cargo build --target wasm32-unknown-unknown
      # Explicit compile validation of the wasm `simd128` lane: the
      # `wasm128` backend needs the target feature enabled at compile time.
      - run: cargo build --target wasm32-unknown-unknown --features simd
        env:
          RUSTFLAGS: -D warnings -C target-feature=+simd128

  msrv:
    name: msrv 1.93
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo check --locked --all-features --all-targets

  # The MSRV consumer matrix: every negative snippet rejects and the positive
  # consumer tests run on 1.93.
  msrv-accept:
    name: msrv 1.93 accept
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: extractions/setup-just@v2
      - run: rustup toolchain install 1.93 --profile minimal
      - run: just msrv-accept

  # The internals exposure closure: SIMD-less compilation and every SIMD
  # feature set compile the facade and the internals consumers together.
  internals:
    name: internals feature closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - run: just features-internals

  # The gather regression executes as i686 release code with wrapping arithmetic
  # under both feature ends. Default-feature i686 uses the portable backend;
  # direct x64-kernel regressions execute in the native test matrix.
  gather-32:
    name: gather validation i686 (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: extractions/setup-just@v2
      - run: just test-gather-validation-32

  # All educational examples under the default features, then the prepared
  # surface under alloc-only (no std), then the library-noalloc examples
  # with no features at all.
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - run: just examples
      - run: just examples --no-default-features --features alloc
      - run: just examples-portable

  # Every standalone comparison package type-checks against the working
  # copy. The native toolchains the build scripts require: Go and Intel
  # ISA-L for the bench-trio c-archive, C/C++ compilers and Git for the
  # gf16-bench native build. Native competitor work stays on Linux: macOS
  # and Windows runners cannot be assumed to carry these toolchains.
  external-check:
    name: external packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libisal-dev golang-go gcc g++
      - uses: extractions/setup-just@v2
      - run: just external-check

  # Portable benchmark fixtures plus a compiler-derived API inventory.
  # Native GF16 execution belongs to benchmark-check-native on capable hosts.
  benchmark-check:
    name: benchmark surfaces check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config git
      - run: rustup toolchain install nightly-2026-09-30 --profile minimal
      - uses: extractions/setup-just@v2
      - run: just benchmark-check
      - run: just simd-ledger
      - run: just route-check

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets
      # The default set is neither end of the feature walk: without
      # `internals` the x86 re-exports have no consumer outside dispatch.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      # `simd512` without `internals`: tests must not reach the facade
      # unless they gate on it.
      - run: cargo clippy --features simd512 --all-targets -- -D warnings
      # Doc warnings fail the build in every feature configuration the
      # test jobs exercise.
      - run: cargo doc --no-deps
      - run: cargo doc --no-default-features --no-deps
      - run: cargo doc --no-default-features --features alloc --no-deps
      - run: cargo doc --no-default-features --features std --no-deps
      - run: cargo doc --all-features --no-deps

  miri-gfni:
    name: miri (GFNI paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: extractions/setup-just@v2
      # Runtime detection reports nothing under the interpreter, so the
      # recipe promotes the GFNI tier at compile time and Miri executes the
      # owned-unsafe residue. MIRIFLAGS is fixed for this recipe.
      # Non-temporal stores are gated out of Miri in `tests/internals.rs`
      # and stay proof-review-only.
      - run: just unsafe-check-gfni
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # Packaging verification runs from a copy of the archive, outside the
  # tree; the vendored recipe refuses a dirty working tree, which a fresh
  # checkout satisfies. Publication itself stays a manual, tagged operation.
  publish-dry:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v2
      - run: rustup toolchain install 1.93 --profile minimal
      - run: just package-check
      - run: just publish-dry
