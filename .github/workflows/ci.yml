name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      # `alloc` sits between the two ends above: the prepared coefficient
      # collections without `std`. Neither end builds it.
      - run: cargo test --no-default-features --features alloc

  # The dispatch layer picks one backend per process, so a single test run only
  # ever exercises the host's best. Re-run the suite pinned to each weaker
  # backend the host can still execute.
  backends:
    name: backend sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Strongest declared tier first, matching crate.just TIERS. The
      # request is downgrade-only: a runner without the crypto extensions
      # resolves to the strongest tier it can prove instead, so a green run
      # here is not by itself GFNI coverage.
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: v3_gfni_crypto
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: v3
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: v2
      - run: cargo test --all-features
        env:
          SIMD_BACKEND: scalar

  # Ground rule: line coverage of the crate's own source must stay at or
  # above 95%. One run per forced backend tier, merged, so every
  # dispatchable backend counts. The GFNI kernels (kernel/x86/gf8.rs,
  # gf16.rs, gf32.rs, gf64.rs, avx512.rs) are excluded from the gate: they
  # only execute on GFNI/AVX-512 hosts, the ubuntu-latest fleet mixes
  # Xeon generations, and counting them made the gate depend on which
  # runner the job landed on (2026-08-24: identical commits measured 70.8%
  # and 98.8% over the full crate). Those files are still validated by the
  # direct-kernel differential tests on capable hosts; the 95% gate — and
  # the summary it prints — are measured over the code every CI runner
  # executes. Excluded-set coverage for reference: 97.8% (no-GFNI host) /
  # 99.4% (GFNI host).
  coverage:
    name: coverage >=95% (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - run: cargo llvm-cov --no-report --all-features
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v3_gfni_crypto
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v3
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v2
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: scalar
      - run: cargo llvm-cov report --summary-only --ignore-filename-regex 'kernel/x86/(gf8|gf16|gf32|gf64|avx512)(/|\.rs$)|kernel/(gf8|tower)\.rs$'
      - run: cargo llvm-cov report --fail-under-lines 95 --ignore-filename-regex 'kernel/x86/(gf8|gf16|gf32|gf64|avx512)(/|\.rs$)|kernel/(gf8|tower)\.rs$' --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage.lcov

  cross:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }}
      # Explicit compile validation of the wasm `simd128` lane: the
      # `wasm128` backend needs the target feature enabled at compile time.
      - run: cargo build --target wasm32-unknown-unknown --features simd
        if: matrix.target == 'wasm32-unknown-unknown'
        env:
          RUSTFLAGS: -D warnings -C target-feature=+simd128

  msrv:
    name: msrv 1.93
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo check --locked --all-features --all-targets

  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets
      # The default set is neither end of the feature walk: without
      # `internals` the x86 re-exports have no consumer outside dispatch.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      # Doc warnings fail the build in every feature configuration the
      # test jobs exercise.
      - run: cargo doc --no-deps
      - run: cargo doc --no-default-features --no-deps
      - run: cargo doc --no-default-features --features alloc --no-deps
      - run: cargo doc --no-default-features --features std --no-deps
      - run: cargo doc --all-features --no-deps

  miri:
    name: miri (scalar paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: extractions/setup-just@v2
      # Run the same bounded scalar cases and MIRIFLAGS as `just unsafe-check`.
      # The GFNI job below exercises the offset-addressed-row kernel residue.
      - run: just unsafe-check
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  miri-gfni:
    name: miri (GFNI paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: extractions/setup-just@v2
      # Runtime detection reports nothing under the interpreter, so the
      # recipe promotes the GFNI tier at compile time and Miri executes the
      # offset-addressed-row residue. MIRIFLAGS matches `unsafe-check`.
      # Non-temporal stores are gated out of Miri in `tests/internals.rs`
      # and stay proof-review-only.
      - run: just unsafe-check-gfni
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
