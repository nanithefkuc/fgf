[package]
name = "fgf"
version = "0.7.1"
edition = "2024"
rust-version = "1.89"
description = "Faster Galois Fields: SIMD and portable finite-field arithmetic (binary towers and prime fields) and vector kernels"
license = "MIT"
repository = "https://github.com/nanithefkuc/fgf"
readme = "README.md"
homepage = "https://github.com/nanithefkuc/fgf"
publish = false
# Intentional package allowlist: source, the public doc/license set, and the
# intentional tests/benches/examples. Planning notes, local tooling state,
# markdownlint configuration, CI workflow definitions, and `external-bench`
# never enter `cargo package`.
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/AGENTS.md",
    "/BENCHMARKS.md",
    "/LICENSE",
]

[features]
default = ["std", "simd"]
# Standard library. Required for the lazily-built shared table banks and the
# `simdispatch` runtime detection selected by `simd`.
std = ["simdispatch/std"]
# Runtime-dispatched SIMD kernels: v3_gfni_crypto / v3 / v2 on x86 (the
# 64-byte AVX-512 tier is deferred), neon_aes / neon on AArch64, and
# `wasm128` on Wasm. Enabling also resolves the backend via `simdispatch`.
simd = ["std"]
# Expose the crate's internal kernel modules and preparation types for
# downstream libraries that build directly on the kernels. This is not a
# stable semver surface; it is for development of dependent libraries.
internals = ["dep:archmage"]

[dependencies]
simdispatch = { version = "=0.1.0", default-features = false }
archmage = { version = "=0.9.29", optional = true }

# Comparison benchmarks only; the C `simd-accel` path has no wasm sysroot, and
# scoping it here keeps `cargo test --target wasm32-*` buildable.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
reed-solomon-erasure = { version = "6", features = ["simd-accel"] }
# The affine/shuffle crossover harness (`benches/affine.rs`) is the one
# statistical measurement in the crate; x86-only, gated on `internals`.
criterion = "0.8"

[profile.bench]
lto = "thin"
codegen-units = 1

[[bench]]
name = "kernels"
harness = false
# `ops::Plan` and the comparison harness are std-only; without this the bench
# targets break `--no-default-features --all-targets`.
required-features = ["std"]

[[bench]]
name = "compare"
harness = false
required-features = ["std"]

[[bench]]
name = "affine"
harness = false
# Direct kernel calls need the kernel modules public.
required-features = ["std", "internals"]

[[bench]]
name = "dot_product"
harness = false
# Direct GFNI kernel calls need the internal architecture modules.
required-features = ["std", "internals"]

[[example]]
name = "perf_p2"
# Calls internal experimental two-row overwrite kernels directly.
required-features = ["std", "internals"]

# Release codegen a profiler can attribute: opt-level 3 with full debug info
# and no symbol stripping. Frame pointers come from RUSTFLAGS in `just
# profile-perf`, since they are not a Cargo profile key.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
