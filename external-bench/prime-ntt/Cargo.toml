[package]
name = "fgf-bench-prime-ntt"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT"
description = "Consumer validation and tuning harness: prime-field NTT schedules of butterfly-fft over the local fgf working copy"

# An independent unpublished package, not a bench target of `fgf` and a
# workspace of its own: it exists to integration-test the local `fgf` through
# the real `butterfly-fft` consumer APIs without touching that crate's
# published pins or source. The `internals` feature is this harness's concern
# only; `fgf` keeps no production dependency on it or on this package.
[workspace]

[dependencies]
fgf = { path = "../.." }
butterfly-fft = { path = "../../../butterfly-fft", features = ["internals"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# One `fgf` and one `simdispatch` in the graph: the registry dependencies that
# `butterfly-fft` and `fgf` declare resolve to the same local working copies
# this package names directly, matching the umbrella-local patch table.
[patch.crates-io]
fgf = { path = "../.." }
simdispatch = { path = "../../../simdispatch" }

[[bench]]
name = "ntt_consumer"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1
