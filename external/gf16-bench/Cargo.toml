[package]
name = "fgf-gf16-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "MIT"
description = "Matched native GF16 field operations across permissive competitors"

[dependencies]
fgf = { path = "../..", features = ["simd512"] }
archmage = "=0.9.29"
reed-solomon-simd = "=3.1.0"
reed-solomon-erasure = { version = "=6.0.0", default-features = false }

[build-dependencies]
cc = "=1.4.6"

[profile.release]
lto = "thin"
codegen-units = 1
